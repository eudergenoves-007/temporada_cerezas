<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentina XV | Neon Party</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="overflow: hidden;">

    <div class="access-btn" onclick="unlockParty()"><i class="fas fa-bolt"></i></div>

    <div id="lock-screen">
        <div class="glitch-text">XV AÑOS</div>
        <p style="color: #fff; letter-spacing: 5px; margin-top: 20px;">TOCA EL RAYO PARA ENTRAR</p>
    </div>

    <div id="party-content">
        <section class="hero-neon">
            <div class="hero-content">
                <p class="neon-subtitle">MIS 15</p>
                <h1>ÁMBAR</h1>
                <p style="margin-top: 20px;">03 . OCT . 2026</p>
            </div>
        </section>

        <section class="neon-section">
            <h2 style="font-size: 3rem; margin-bottom: 40px;">THE PARTY</h2>
            
            <div class="glass-card">
                <i class="fas fa-map-marker-alt" style="font-size: 2rem; color: var(--neon-pink);"></i>
                <h3>Ubicación</h3>
                <p>Neon Club, Av. Revolución 55</p>
                <a href="#" class="btn-neon">MAPA</a>
            </div>

            <div class="glass-card">
                <i class="fas fa-tshirt" style="font-size: 2rem; color: var(--neon-blue);"></i>
                <h3>Dress Code</h3>
                <p>Casual Chic / ¡Trae algo Neón!</p>
            </div>

            <div class="glass-card">
                <i class="fas fa-gift" style="font-size: 2rem; color: #fff;"></i>
                <h3>Regalos</h3>
                <p>Lluvia de Sobres</p>
            </div>
        </section>
        
        <section class="neon-section">
             <a href="https://wa.me/" class="btn-neon" style="width: 80%;">CONFIRMAR ASISTENCIA</a>
        </section>
    </div>

    <script src="js/logic.js"></script>
</body>
</html>
