<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bautizo: Lucas | Nubes de Algodón</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sky-container">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="cloud c4"></div>
    </div>

    <div class="bubble-container">
        <h2 style="color: #fff; margin-bottom: 30px; font-family: 'Quicksand'; letter-spacing: 3px;">MI BAUTIZO</h2>
        <div class="bubble-btn" onclick="popBubble()"></div>
    </div>

    <div id="content">
        <section class="angel-hero">
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=500&q=80" alt="Bebé">
            </div>
            <h1 class="baby-name">Lucas</h1>
            <p style="color: #fff; font-size: 1.5rem; margin-top: 10px;">22 . Noviembre . 2026</p>
        </section>

        <section class="event-details fade-up">
            <i class="fas fa-church" style="font-size: 2.5rem; color: var(--sky-top); margin-bottom: 20px;"></i>
            <h2 style="font-size: 2.5rem; margin: 0;">Ceremonia</h2>
            <p style="font-size: 1.2rem; margin: 20px 0;">10:00 AM | Capilla del Cielo</p>
            <a href="#" class="btn-sky">VER UBICACIÓN</a>
        </section>

        <section class="event-details fade-up">
            <i class="fas fa-gift" style="font-size: 2.5rem; color: var(--gold); margin-bottom: 20px;"></i>
            <h2 style="font-size: 2.5rem; margin: 0;">Obsequios</h2>
            <p style="font-size: 1.2rem; margin: 20px 0;">Agradecemos su cariño en forma de lluvia de sobres.</p>
        </section>
        
         <section class="event-details fade-up" style="background: transparent; border: none;">
            <a href="https://wa.me/" class="btn-sky" style="background: #25d366; color: white;">CONFIRMAR ASISTENCIA</a>
        </section>
    </div>

    <script src="js/logic.js"></script>
</body>
</html>
